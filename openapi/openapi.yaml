openapi: 3.0.3
info:
  title: RecordRoute API
  version: 0.1.0
  description: |
    RecordRoute 백엔드 API 계약 문서 초안입니다.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /process:
    post:
      summary: Start workflow processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
      responses:
        '200':
          description: Workflow accepted/executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
  /progress/{task_id}:
    get:
      summary: Get workflow progress for task
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task progress payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgress'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
  /history:
    get:
      summary: Get upload and workflow history
      responses:
        '200':
          description: History list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
        '500':
          $ref: '#/components/responses/Error500'
  /search:
    get:
      summary: Search by keyword/vector
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [similarity, date, uploaded_at]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: min_score
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        '200':
          description: Search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          $ref: '#/components/responses/Error500'
  /delete_records:
    post:
      summary: Delete records (destructive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record_ids:
                  type: array
                  items:
                    type: string
              required: [record_ids]
      responses:
        '200':
          description: All records deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
                required: [success, results]
        '207':
          description: Partial deletion success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
                required: [success, results]
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
components:
  schemas:
    ProcessRequest:
      type: object
      properties:
        file_path:
          type: string
          example: DB/uploads/uuid/sample.m4a
        steps:
          type: array
          items:
            type: string
            enum: [stt, correct, summary, summarize, diarize]
        record_id:
          type: string
        task_id:
          type: string
        model_settings:
          type: object
          additionalProperties: true
      required: [file_path, steps]
    ProcessResponse:
      type: object
      properties:
        task_id:
          type: string
        retry_mode:
          type: string
        retry_of_task_id:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
        retryable:
          type: boolean
          nullable: true
        failed_step:
          type: string
          nullable: true
      additionalProperties: true
    TaskProgress:
      type: object
      properties:
        task_id:
          type: string
        message:
          type: string
        stage:
          type: string
          nullable: true
        progress_percent:
          type: number
          nullable: true
        eta_seconds:
          type: number
          nullable: true
        error:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: true
    HistoryItem:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        uploaded_at:
          type: string
        status:
          type: object
          additionalProperties: true
      additionalProperties: true
    SearchResponse:
      type: object
      properties:
        contract_version:
          type: string
          example: search-v2
        query:
          type: string
        similarDocuments:
          type: array
          items:
            type: object
            additionalProperties: true
        keywordMatches:
          type: array
          items:
            type: object
            additionalProperties: true
        sort:
          type: object
          additionalProperties: true
        filters:
          type: object
          additionalProperties: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, error]
  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
