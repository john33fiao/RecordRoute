[workspace]
members = [
  "crates/recordroute-cli",
  "crates/recordroute-core",
  "crates/recordroute-models",
  "crates/recordroute-search",
  "crates/recordroute-server",
  "crates/recordroute-storage",
  "crates/recordroute-workflow",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
