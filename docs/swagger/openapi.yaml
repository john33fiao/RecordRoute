openapi: 3.0.3
info:
  title: RecordRoute Orchestrator API
  version: 0.2.0
  description: Rust 오케스트레이터 기준 API 계약.
servers:
  - url: http://localhost:18000
    description: API server
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /jobs:
    post:
      summary: Enqueue a job
      parameters:
        - in: query
          name: engine
          schema:
            type: string
            enum: [stt, summarize, embed]
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
        '429':
          description: queue full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: dispatcher unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /jobs/{job_id}:
    get:
      summary: Get job status/result
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: job snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: invalid job id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    JobCreatedResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
    JobStatus:
      type: string
      enum: [queued, running, completed, failed, timeout, canceled, rejected]
    JobError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - queue_full
            - engine_full
            - engine_dispatcher_closed
            - engine_connect_timeout
            - engine_request_timeout
            - engine_transport_error
            - engine_upstream_4xx
            - engine_upstream_5xx
            - engine_retry_exhausted
            - job_timeout
            - job_canceled
            - invalid_job_id
        message:
          type: string
    Job:
      type: object
      required: [job_id, status, engine, created_at_ms]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        engine:
          type: string
          enum: [stt, summarize, embed]
        created_at_ms:
          type: integer
          format: int64
        started_at_ms:
          type: integer
          format: int64
          nullable: true
        finished_at_ms:
          type: integer
          format: int64
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error:
          allOf:
            - $ref: '#/components/schemas/JobError'
          nullable: true
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
