openapi: 3.1.0
info:
  title: RecordRoute Local API
  version: 0.1.0
  description: |
    `rust/src/server.rs` 기준으로 현재 구현된 RecordRoute HTTP API 명세입니다.

    - 서버 기본 바인드: `127.0.0.1:38080`
    - 메타데이터 기본 저장소: `db/index.sqlite3`
    - 메타데이터 backend: SQLite 기본, 필요 시 PostgreSQL 지원
    - 오디오 기본 저장소: `db/audio/`
    - 비동기 작업 제출 엔드포인트는 즉시 처리 결과 대신 제출/중복제거 상태를 반환할 수 있습니다.
servers:
  - url: http://127.0.0.1:38080
    description: Local development server

tags:
  - name: web
  - name: server
  - name: system
  - name: models
  - name: queue
  - name: dictionary
  - name: jobs
  - name: stt
  - name: summary
  - name: files
paths:
  /:
    get:
      tags: [web]
      summary: Serve embedded web UI index page
      operationId: getWebIndex
      responses:
        '200':
          description: HTML index page
          content:
            text/html:
              schema:
                type: string

  /app.js:
    get:
      tags: [web]
      summary: Serve embedded web UI JavaScript bundle
      operationId: getWebAppJs
      responses:
        '200':
          description: JavaScript asset
          content:
            text/javascript:
              schema:
                type: string

  /app.css:
    get:
      tags: [web]
      summary: Serve embedded web UI stylesheet
      operationId: getWebAppCss
      responses:
        '200':
          description: CSS asset
          content:
            text/css:
              schema:
                type: string

  /server/ping:
    post:
      tags: [server]
      summary: Ping endpoint
      operationId: postServerPing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingRequest'
      responses:
        '200':
          description: Ping success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/status:
    get:
      tags: [system]
      summary: Toolchain/model availability
      operationId: getSystemStatus
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/status:
    get:
      tags: [models]
      summary: Detailed model preparation status
      operationId: getModelsStatus
      responses:
        '200':
          description: Model status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/whisper/prepare:
    post:
      tags: [models]
      summary: Prepare whisper model in background
      operationId: postPrepareWhisperModel
      responses:
        '200':
          description: Model already ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '202':
          description: New preparation accepted or running preparation deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '503':
          description: Toolchain unavailable or model configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/llama/prepare:
    post:
      tags: [models]
      summary: Prepare llama summary and embedding models in background
      operationId: postPrepareLlamaModel
      responses:
        '200':
          description: Model already ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '202':
          description: New preparation accepted or running preparation deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '503':
          description: Toolchain unavailable or model configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue:
    get:
      tags: [queue]
      summary: Inspect persisted category queue state
      operationId: getQueue
      responses:
        '200':
          description: Queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue/pause:
    post:
      tags: [queue]
      summary: Pause or resume background queue dispatching
      operationId: postQueuePause
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueuePauseRequest'
      responses:
        '200':
          description: Updated queue snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue/cancel-pending:
    post:
      tags: [queue]
      summary: Cancel queued tasks without interrupting the currently running task
      operationId: postQueueCancelPending
      responses:
        '200':
          description: Pending queue entries cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCancelPendingResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dictionary/keywords:
    get:
      tags: [dictionary]
      summary: List grouped STT dictionary keywords
      operationId: getDictionaryKeywords
      responses:
        '200':
          description: Grouped dictionary keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [dictionary]
      summary: Add or promote a user-managed STT dictionary keyword
      operationId: postDictionaryKeyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictionaryKeywordRequest'
      responses:
        '200':
          description: Dictionary keyword added or promoted into the user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '400':
          description: Invalid request body or empty keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dictionary/keywords/{keyword}:
    delete:
      tags: [dictionary]
      summary: Delete a user-managed dictionary keyword
      operationId: deleteDictionaryKeyword
      parameters:
        - name: keyword
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated grouped dictionary keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '404':
          description: User dictionary keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dictionary/keywords/auto/{keyword}/promote:
    post:
      tags: [dictionary]
      summary: Promote an auto-generated keyword into the user-managed list
      operationId: postPromoteAutoDictionaryKeyword
      parameters:
        - name: keyword
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated grouped dictionary keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '404':
          description: Auto-generated dictionary keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dictionary/keywords/auto:
    delete:
      tags: [dictionary]
      summary: Delete all auto-generated dictionary keywords
      operationId: deleteAllAutoDictionaryKeywords
      responses:
        '200':
          description: Updated grouped dictionary keywords after deleting all auto-generated entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dictionary/keywords/auto/{keyword}:
    delete:
      tags: [dictionary]
      summary: Delete an auto-generated dictionary keyword
      operationId: deleteAutoDictionaryKeyword
      parameters:
        - name: keyword
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated grouped dictionary keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryKeywordListResponse'
        '404':
          description: Auto-generated dictionary keyword not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs:
    post:
      tags: [jobs]
      summary: Create or reuse ffmpeg job
      operationId: postJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Completed job reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '202':
          description: New job accepted or running job deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '400':
          description: Invalid input path / malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: FFmpeg toolchain unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [jobs]
      summary: List jobs
      operationId: getJobs
      parameters:
        - in: query
          name: source_ref
          required: false
          schema:
            type: string
          description: Optional exact source reference filter
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/upload:
    post:
      tags: [jobs]
      summary: Upload file and create or reuse ffmpeg job
      description: |
        multipart 업로드를 스트리밍으로 저장한 뒤 ffmpeg job을 제출합니다.
        업로드 가능한 최대 파일 크기는 512MB입니다.
      operationId: postJobsUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Completed job reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '202':
          description: New job accepted or running job deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '400':
          description: Invalid multipart body or missing file field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file exceeds the 512MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: FFmpeg toolchain unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/batch-process:
    post:
      tags: [jobs]
      summary: Batch queue jobs for the full pipeline or a single stage
      description: |
        현재 시점에 조건을 만족한 task만 큐에 넣습니다.
        같은 요청 안에서 미래 summary 결과를 예측해 embedding까지 예약하지는 않습니다.
      operationId: postJobsBatchProcess
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchProcessRequest'
      responses:
        '202':
          description: Batch queue submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchQueueSubmissionResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/completed:
    get:
      tags: [jobs]
      summary: List completed jobs
      operationId: getCompletedJobs
      responses:
        '200':
          description: Completed job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get full job record
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/status:
    get:
      tags: [jobs]
      summary: Get job status and task states
      operationId: getJobStatus
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/reset:
    post:
      tags: [jobs]
      summary: Reset selected pipeline artifacts for a job
      description: |
        기존 job/source는 유지한 채 선택한 단계의 산출물만 삭제합니다.
        서버는 전역 queue가 비어 있고 어떤 job에도 queued/running task가 없을 때만 reset을 허용합니다.
      operationId: postJobReset
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResetRequest'
      responses:
        '200':
          description: Selected stages were reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResetResponse'
        '400':
          description: No stages selected or queue is not idle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt:
    post:
      tags: [stt]
      summary: Submit STT task for a job
      operationId: postStt
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SttRequest'
      responses:
        '202':
          description: STT accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '400':
          description: Invalid request or job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [stt]
      summary: Get STT task status
      operationId: getStt
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: STT task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/progress:
    get:
      tags: [stt]
      summary: Poll current STT progress snapshot
      operationId: getSttProgress
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: STT progress snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttProgressResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/texts:
    get:
      tags: [stt]
      summary: List STT transcripts (.txt contents)
      operationId: getSttTexts
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Transcript list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttTranscriptListResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/texts/{transcript_id}:
    get:
      tags: [stt]
      summary: Get one transcript by transcript id (file stem)
      operationId: getSttText
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: transcript_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transcript detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttTranscriptText'
        '400':
          description: Invalid transcript id/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or transcript not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary:
    post:
      tags: [summary]
      summary: Submit summary task for a job
      operationId: postSummary
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
      responses:
        '202':
          description: Summary accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '400':
          description: Invalid request or job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [summary]
      summary: Get summary task status
      operationId: getSummary
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary/text:
    get:
      tags: [summary]
      summary: Get summary/result.md markdown content as JSON
      operationId: getSummaryText
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary text payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryTextResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or summary text not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary/embedding:
    post:
      tags: [summary]
      summary: Submit summary embedding task for a job
      description: |
        embedding은 명시적 stage입니다.
        summary 완료만으로 자동 제출되지는 않으므로 필요 시 별도로 호출해야 합니다.
      operationId: postSummaryEmbedding
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Summary embedding accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEmbeddingResponse'
        '400':
          description: Summary artifact missing or invalid job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [summary]
      summary: Get summary embedding task status and metadata
      operationId: getSummaryEmbedding
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary embedding task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEmbeddingResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /summary/search:
    post:
      tags: [summary]
      summary: Search summaries by embedding similarity
      operationId: postSummarySearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarySearchRequest'
      responses:
        '200':
          description: Summary similarity search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarySearchResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Embedding toolchain or model unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/files:
    get:
      tags: [files]
      summary: List downloadable files for a job
      operationId: getJobFiles
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/files/{file_name}:
    get:
      tags: [files]
      summary: Download one allowed job file
      description: |
        서버 구현(axum)은 와일드카드 라우트(`/jobs/{job_id}/files/{*file_name}`)로 동작합니다.
        이 명세에서는 OpenAPI 호환성을 위해 `{file_name}`으로 표기합니다.
        `file_name`은 `stt/channel_01.txt` 또는 `summary/result.md`처럼 슬래시를 포함할 수 있으며,
        클라이언트는 경로를 URL 인코딩해서 전달해야 합니다.
      operationId: getJobFile
      x-axum-route: /jobs/{job_id}/files/{*file_name}
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: file_name
          in: path
          required: true
          allowReserved: true
          schema:
            type: string
      responses:
        '200':
          description: Raw file bytes (서버가 Content-Type 헤더를 명시적으로 설정하지 않을 수 있음)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path or disallowed file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    PingRequest:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    PingResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: HTTP status code string
          examples: ['400', '404', '500']
        message:
          type: string

    CreateJobRequest:
      type: object
      required: [input_path]
      properties:
        input_path:
          type: string
          description: Audio file path on server-local filesystem

    JobResetSelection:
      type: object
      properties:
        all:
          type: boolean
          default: false
        ffmpeg:
          type: boolean
          default: false
        stt:
          type: boolean
          default: false
        summary:
          type: boolean
          default: false
        embedding:
          type: boolean
          default: false

    JobResetRequest:
      allOf:
        - $ref: '#/components/schemas/JobResetSelection'
      description: |
        `all=true`이면 ffmpeg/stt/summary/embedding을 모두 reset 대상으로 정규화합니다.

    BatchProcessTarget:
      type: string
      enum: [all, ffmpeg, stt, summary, embedding]

    BatchProcessRequest:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/BatchProcessTarget'
      description: Optional batch target. Omit or use `all` to preserve the current full-pipeline batch behavior.

    SummaryRequest:
      type: object
      properties:
        force_regenerate:
          type: boolean
          default: false

    DictionaryKeywordRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string

    DictionaryKeywordListResponse:
      type: object
      required: [user_keywords, auto_keywords]
      properties:
        user_keywords:
          type: array
          items:
            type: string
          description: User-managed keywords that are injected into STT prompts
        auto_keywords:
          type: array
          items:
            type: string
          description: LLM-extracted global keyword suggestions stored for later review and future STT injection; they are not injected automatically yet

    SttRequest:
      type: object
      properties:
        audio_files:
          type: array
          items:
            type: string
          default: []
          description: Target audio files under job directory (ex. channel_01.wav)
        mono_mix_only:
          type: boolean
          default: false
        keywords:
          type: array
          items:
            type: string
          default: []
          description: Optional keyword hints passed to whisper initial prompt for proper nouns and domain terms
      description: mono_mix_only=true and non-empty audio_files cannot be used together. Language is taken from RECORDROUTE_WHISPER_LANGUAGE on the server.

    TaskSubmissionResponse:
      type: object
      required:
        [job_id, task_type, status, message, reused, deduplicated, task]
      properties:
        job_id:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskType'
        status:
          type: string
          description: API-level status text (ex. accepted, ok)
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        queue:
          oneOf:
            - $ref: '#/components/schemas/QueueInfoResponse'
            - type: 'null'
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'

    FileListResponse:
      type: object
      required: [job_id, files]
      properties:
        job_id:
          type: string
        files:
          type: array
          items:
            type: string

    JobStatusResponse:
      type: object
      required: [job_id, job_status, tasks, error_message]
      properties:
        job_id:
          type: string
        job_status:
          $ref: '#/components/schemas/JobStatus'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskRecord'
        error_message:
          oneOf:
            - type: string
            - type: 'null'

    JobResetResponse:
      type: object
      required: [job_id, message, deleted, job]
      properties:
        job_id:
          type: string
        message:
          type: string
        deleted:
          $ref: '#/components/schemas/JobResetSelection'
        job:
          $ref: '#/components/schemas/JobRecord'

    SystemStatusResponse:
      type: object
      required:
        [ffmpeg_available, whisper_available, llama_available, whisper_model_ready, llama_model_ready, llama_embedding_model_ready, errors]
      properties:
        ffmpeg_available:
          type: boolean
        whisper_available:
          type: boolean
        llama_available:
          type: boolean
        whisper_model_ready:
          type: boolean
        llama_model_ready:
          type: boolean
        llama_embedding_model_ready:
          type: boolean
        errors:
          type: array
          items:
            type: string

    ModelKind:
      type: string
      enum: [whisper, llama]

    ModelPreparationStatus:
      type: string
      enum: [idle, running, completed, failed]

    ModelPreparationRecord:
      type: object
      required: [status, started_at, finished_at, heartbeat_at, last_error]
      properties:
        status:
          $ref: '#/components/schemas/ModelPreparationStatus'
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        heartbeat_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'

    ModelStatusEntryResponse:
      type: object
      required: [available, ready, error, embedding_available, embedding_ready, embedding_error, preparation]
      properties:
        available:
          type: boolean
        ready:
          type: boolean
        error:
          oneOf:
            - type: string
            - type: 'null'
        embedding_available:
          type: boolean
        embedding_ready:
          type: boolean
        embedding_error:
          oneOf:
            - type: string
            - type: 'null'
        preparation:
          $ref: '#/components/schemas/ModelPreparationRecord'

    ModelStatusResponse:
      type: object
      required: [whisper, llama]
      properties:
        whisper:
          $ref: '#/components/schemas/ModelStatusEntryResponse'
        llama:
          $ref: '#/components/schemas/ModelStatusEntryResponse'

    ModelPrepareResponse:
      type: object
      required:
        [model, status, message, ready, already_ready, deduplicated, preparation]
      properties:
        model:
          $ref: '#/components/schemas/ModelKind'
        status:
          type: string
          description: API-level status text ('ok' or 'accepted')
        message:
          type: string
        ready:
          type: boolean
        already_ready:
          type: boolean
        deduplicated:
          type: boolean
        preparation:
          $ref: '#/components/schemas/ModelPreparationRecord'

    SttTranscriptText:
      type: object
      required: [transcript_id, file_name, text]
      properties:
        transcript_id:
          type: string
        file_name:
          type: string
        text:
          type: string
          description: Transcript plain text body

    SttTranscriptListResponse:
      type: object
      required: [job_id, transcripts]
      properties:
        job_id:
          type: string
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/SttTranscriptText'

    SttProgressResponse:
      type: object
      required: [job_id, task, phase, total_files, completed_files, progress_percent]
      properties:
        job_id:
          type: string
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'
        phase:
          type: string
          enum: [idle, queued, running, completed, failed]
        total_files:
          type: integer
          minimum: 0
        completed_files:
          type: integer
          minimum: 0
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100

    SummaryTextResponse:
      type: object
      required: [job_id, file_name, text]
      properties:
        job_id:
          type: string
        file_name:
          type: string
          examples: [result.md]
        text:
          type: string
          description: Markdown summary body
        one_line_summary:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional one-line alias for the recording

    SummarySearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: Defaults to 10 and is clamped to 50.
        min_score:
          oneOf:
            - type: number
            - type: 'null'

    SummarySearchResultResponse:
      type: object
      required: [job_id, score, source_file_name, summary_file_name, summary_excerpt]
      properties:
        job_id:
          type: string
        score:
          type: number
        source_file_name:
          type: string
        summary_file_name:
          type: string
        summary_excerpt:
          type: string

    SummarySearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SummarySearchResultResponse'

    SummaryEmbeddingRecord:
      type: object
      required: [model_id, text_sha256, dimension, normalized, created_at]
      properties:
        model_id:
          type: string
        text_sha256:
          type: string
        dimension:
          type: integer
          minimum: 0
        normalized:
          type: boolean
        created_at:
          type: string
          format: date-time

    SummaryEmbeddingResponse:
      type: object
      required: [job_id, status, message, reused, deduplicated, task, metadata]
      properties:
        job_id:
          type: string
        status:
          type: string
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        queue:
          oneOf:
            - $ref: '#/components/schemas/QueueInfoResponse'
            - type: 'null'
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/SummaryEmbeddingRecord'
            - type: 'null'

    JobSubmissionResponse:
      type: object
      required:
        [job_id, status, message, reused, deduplicated, started_at, finished_at, source_ref, source_kind, source_content_sha256, source_file_name, probe, outputs, error_message]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        queue:
          oneOf:
            - $ref: '#/components/schemas/QueueInfoResponse'
            - type: 'null'
        started_at:
          type: string
        finished_at:
          oneOf:
            - type: string
            - type: 'null'
        source_ref:
          type: string
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_content_sha256:
          type: string
        source_file_name:
          type: string
        probe:
          $ref: '#/components/schemas/JobProbe'
        outputs:
          $ref: '#/components/schemas/JobOutputs'
        error_message:
          oneOf:
            - type: string
            - type: 'null'

    JobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobRecord'

    BatchQueueSubmissionResponse:
      type: object
      required: [total_jobs, ffmpeg_queued, stt_queued, summary_queued, embedding_queued]
      description: Queueing result for the current planning snapshot only
      properties:
        total_jobs:
          type: integer
          minimum: 0
        ffmpeg_queued:
          type: integer
          minimum: 0
        stt_queued:
          type: integer
          minimum: 0
        summary_queued:
          type: integer
          minimum: 0
        embedding_queued:
          type: integer
          minimum: 0

    JobRecord:
      type: object
      required:
        [job_id, status, started_at, finished_at, source_ref, source_kind, source_content_sha256, source_file_name, probe, split_strategy, outputs, error_message, summary_embedding, tasks]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        started_at:
          type: string
        finished_at:
          oneOf:
            - type: string
            - type: 'null'
        source_ref:
          type: string
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_content_sha256:
          type: string
        source_file_name:
          type: string
        probe:
          $ref: '#/components/schemas/JobProbe'
        split_strategy:
          $ref: '#/components/schemas/SplitStrategy'
        outputs:
          $ref: '#/components/schemas/JobOutputs'
        error_message:
          oneOf:
            - type: string
            - type: 'null'
        summary_embedding:
          oneOf:
            - $ref: '#/components/schemas/SummaryEmbeddingRecord'
            - type: 'null'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskRecord'

    TaskRecord:
      type: object
      required: [task_id, task_type, status, queued_at, started_at, finished_at, last_error, retry_count, request_fingerprint]
      properties:
        task_id:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskType'
        status:
          $ref: '#/components/schemas/TaskStatus'
        queued_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'
        retry_count:
          type: integer
          minimum: 0
        request_fingerprint:
          oneOf:
            - type: string
            - type: 'null'
          description: Dedupe fingerprint derived from the queued request payload for this task

    JobProbe:
      type: object
      required: [channels, channel_layout]
      properties:
        channels:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        channel_layout:
          oneOf:
            - type: string
            - type: 'null'

    JobOutputs:
      type: object
      required: [merged_mono_wav, split_mono_wavs]
      properties:
        merged_mono_wav:
          description: Canonical mono output file name for the job.
          oneOf:
            - type: string
            - type: 'null'
        split_mono_wavs:
          description: Per-channel mono outputs. Empty for mono-source jobs with split_strategy=merged_mono_only.
          type: array
          items:
            $ref: '#/components/schemas/JobSplitOutput'

    JobSplitOutput:
      type: object
      required: [channel_index, path]
      properties:
        channel_index:
          type: integer
          minimum: 0
        path:
          type: string

    JobStatus:
      type: string
      enum: [queued, running, completed, failed]

    SourceKind:
      type: string
      enum: [local_file, upload]

    TaskStatus:
      type: string
      enum: [queued, running, completed, failed]

    QueueCategory:
      type: string
      enum: [ffmpeg, stt, llm, embed]

    QueueInfoResponse:
      type: object
      required: [category, position, queued_at]
      properties:
        category:
          $ref: '#/components/schemas/QueueCategory'
        position:
          type: integer
          minimum: 1
        queued_at:
          type: string
          format: date-time

    QueueEntryResponse:
      type: object
      required: [job_id, task_type, category, queued_at]
      properties:
        job_id:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskType'
        category:
          $ref: '#/components/schemas/QueueCategory'
        queued_at:
          type: string
          format: date-time

    QueueBatchResponse:
      type: object
      required: [category, running, entries]
      properties:
        category:
          $ref: '#/components/schemas/QueueCategory'
        running:
          oneOf:
            - $ref: '#/components/schemas/QueueEntryResponse'
            - type: 'null'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntryResponse'

    QueueStatusResponse:
      type: object
      required: [paused, burst_limit, active_batch, pending_batches]
      properties:
        paused:
          type: boolean
        burst_limit:
          type: integer
          minimum: 1
          description: Effective category burst rotation limit. Derived from RECORDROUTE_QUEUE_BURST_LIMIT and defaults to 100.
        active_batch:
          oneOf:
            - $ref: '#/components/schemas/QueueBatchResponse'
            - type: 'null'
        pending_batches:
          type: array
          items:
            $ref: '#/components/schemas/QueueBatchResponse'

    QueuePauseRequest:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean

    QueueCancelPendingResponse:
      type: object
      required: [total_cancelled, ffmpeg_cancelled, stt_cancelled, summary_cancelled, embedding_cancelled]
      properties:
        total_cancelled:
          type: integer
          minimum: 0
        ffmpeg_cancelled:
          type: integer
          minimum: 0
        stt_cancelled:
          type: integer
          minimum: 0
        summary_cancelled:
          type: integer
          minimum: 0
        embedding_cancelled:
          type: integer
          minimum: 0

    TaskType:
      type: string
      enum: [ffmpeg, stt, summary, embedding]

    SplitStrategy:
      type: string
      enum: [per_channel_plus_merged_mono, merged_mono_only]
