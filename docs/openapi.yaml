openapi: 3.1.0
info:
  title: RecordRoute Local API
  version: 0.1.0
  description: |
    `rust/src/server.rs` 기준으로 현재 구현된 RecordRoute HTTP API 명세입니다.

    - 서버 기본 바인드: `127.0.0.1:38080`
    - 상태/결과 저장 SoT: `db/index.json`
    - 비동기 작업 제출 엔드포인트는 즉시 처리 결과 대신 제출/중복제거 상태를 반환할 수 있습니다.
servers:
  - url: http://127.0.0.1:38080
    description: Local development server

tags:
  - name: web
  - name: server
  - name: system
  - name: models
  - name: jobs
  - name: stt
  - name: summary
  - name: files
paths:
  /:
    get:
      tags: [web]
      summary: Serve embedded web UI index page
      operationId: getWebIndex
      responses:
        '200':
          description: HTML index page
          content:
            text/html:
              schema:
                type: string

  /app.js:
    get:
      tags: [web]
      summary: Serve embedded web UI JavaScript bundle
      operationId: getWebAppJs
      responses:
        '200':
          description: JavaScript asset
          content:
            text/javascript:
              schema:
                type: string

  /app.css:
    get:
      tags: [web]
      summary: Serve embedded web UI stylesheet
      operationId: getWebAppCss
      responses:
        '200':
          description: CSS asset
          content:
            text/css:
              schema:
                type: string

  /server/ping:
    post:
      tags: [server]
      summary: Ping endpoint
      operationId: postServerPing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingRequest'
      responses:
        '200':
          description: Ping success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system/status:
    get:
      tags: [system]
      summary: Toolchain/model availability
      operationId: getSystemStatus
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/status:
    get:
      tags: [models]
      summary: Detailed model preparation status
      operationId: getModelsStatus
      responses:
        '200':
          description: Model status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/whisper/prepare:
    post:
      tags: [models]
      summary: Prepare whisper model in background
      operationId: postPrepareWhisperModel
      responses:
        '200':
          description: Model already ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '202':
          description: New preparation accepted or running preparation deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '503':
          description: Toolchain unavailable or model configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /models/llama/prepare:
    post:
      tags: [models]
      summary: Prepare llama summary and embedding models in background
      operationId: postPrepareLlamaModel
      responses:
        '200':
          description: Model already ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '202':
          description: New preparation accepted or running preparation deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrepareResponse'
        '503':
          description: Toolchain unavailable or model configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs:
    post:
      tags: [jobs]
      summary: Create or reuse ffmpeg job
      operationId: postJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Completed job reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '202':
          description: New job accepted or running job deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '400':
          description: Invalid input path / malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: FFmpeg toolchain unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [jobs]
      summary: List jobs
      operationId: getJobs
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/upload:
    post:
      tags: [jobs]
      summary: Upload file and create or reuse ffmpeg job
      description: |
        multipart 업로드를 스트리밍으로 저장한 뒤 ffmpeg job을 제출합니다.
        업로드 가능한 최대 파일 크기는 512MB입니다.
      operationId: postJobsUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Completed job reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '202':
          description: New job accepted or running job deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmissionResponse'
        '400':
          description: Invalid multipart body or missing file field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file exceeds the 512MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: FFmpeg toolchain unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/completed:
    get:
      tags: [jobs]
      summary: List completed jobs
      operationId: getCompletedJobs
      responses:
        '200':
          description: Completed job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/by-source:
    get:
      tags: [jobs]
      summary: List jobs by source path
      operationId: getJobsBySource
      parameters:
        - in: query
          name: source_path
          required: true
          schema:
            type: string
          description: Exact source path used when creating the ffmpeg job
      responses:
        '200':
          description: Filtered job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          description: Missing source_path query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get full job record
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/status:
    get:
      tags: [jobs]
      summary: Get job status and task states
      operationId: getJobStatus
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt:
    post:
      tags: [stt]
      summary: Submit STT task for a job
      operationId: postStt
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SttRequest'
      responses:
        '202':
          description: STT accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '400':
          description: Invalid request or job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [stt]
      summary: Get STT task status
      operationId: getStt
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: STT task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/progress:
    get:
      tags: [stt]
      summary: Poll current STT progress snapshot
      operationId: getSttProgress
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: STT progress snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttProgressResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/texts:
    get:
      tags: [stt]
      summary: List STT transcripts (.txt contents)
      operationId: getSttTexts
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Transcript list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttTranscriptListResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/stt/texts/{transcript_id}:
    get:
      tags: [stt]
      summary: Get one transcript by transcript id (file stem)
      operationId: getSttText
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: transcript_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transcript detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttTranscriptText'
        '400':
          description: Invalid transcript id/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or transcript not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary:
    post:
      tags: [summary]
      summary: Submit summary task for a job
      operationId: postSummary
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
      responses:
        '202':
          description: Summary accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '400':
          description: Invalid request or job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [summary]
      summary: Get summary task status
      operationId: getSummary
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary/text:
    get:
      tags: [summary]
      summary: Get summary/result.md markdown content as JSON
      operationId: getSummaryText
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary text payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryTextResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or summary text not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/summary/embedding:
    post:
      tags: [summary]
      summary: Submit summary embedding task for a job
      operationId: postSummaryEmbedding
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Summary embedding accepted/reused/deduplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEmbeddingResponse'
        '400':
          description: Summary artifact missing or invalid job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [summary]
      summary: Get summary embedding task status and metadata
      operationId: getSummaryEmbedding
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Summary embedding task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEmbeddingResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /summary/search:
    post:
      tags: [summary]
      summary: Search summaries by embedding similarity
      operationId: postSummarySearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarySearchRequest'
      responses:
        '200':
          description: Summary similarity search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarySearchResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Embedding toolchain or model unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/files:
    get:
      tags: [files]
      summary: List downloadable files for a job
      operationId: getJobFiles
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '400':
          description: Invalid state/path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/files/{file_name}:
    get:
      tags: [files]
      summary: Download one allowed job file
      description: |
        서버 구현(axum)은 와일드카드 라우트(`/jobs/{job_id}/files/{*file_name}`)로 동작합니다.
        이 명세에서는 OpenAPI 호환성을 위해 `{file_name}`으로 표기합니다.
        `file_name`은 `stt/channel_01.txt` 또는 `summary/result.md`처럼 슬래시를 포함할 수 있으며,
        클라이언트는 경로를 URL 인코딩해서 전달해야 합니다.
      operationId: getJobFile
      x-axum-route: /jobs/{job_id}/files/{*file_name}
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: file_name
          in: path
          required: true
          allowReserved: true
          schema:
            type: string
      responses:
        '200':
          description: Raw file bytes (서버가 Content-Type 헤더를 명시적으로 설정하지 않을 수 있음)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path or disallowed file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    PingRequest:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    PingResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: HTTP status code string
          examples: ['400', '404', '500']
        message:
          type: string

    CreateJobRequest:
      type: object
      required: [input_path]
      properties:
        input_path:
          type: string
          description: Audio file path on server-local filesystem

    SummaryRequest:
      type: object
      properties:
        force_regenerate:
          type: boolean
          default: false

    SttRequest:
      type: object
      properties:
        audio_files:
          type: array
          items:
            type: string
          default: []
          description: Target audio files under job directory (ex. channel_01.wav)
        mono_mix_only:
          type: boolean
          default: false
      description: mono_mix_only=true and non-empty audio_files cannot be used together.

    TaskSubmissionResponse:
      type: object
      required:
        [job_id, task_type, status, message, reused, deduplicated, task]
      properties:
        job_id:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskType'
        status:
          type: string
          description: API-level status text (ex. accepted, ok)
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'

    FileListResponse:
      type: object
      required: [job_id, files]
      properties:
        job_id:
          type: string
        files:
          type: array
          items:
            type: string

    JobStatusResponse:
      type: object
      required: [job_id, job_status, tasks, error_message]
      properties:
        job_id:
          type: string
        job_status:
          $ref: '#/components/schemas/JobStatus'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskRecord'
        error_message:
          oneOf:
            - type: string
            - type: 'null'

    SystemStatusResponse:
      type: object
      required:
        [ffmpeg_available, whisper_available, llama_available, whisper_model_ready, llama_model_ready, llama_embedding_model_ready, errors]
      properties:
        ffmpeg_available:
          type: boolean
        whisper_available:
          type: boolean
        llama_available:
          type: boolean
        whisper_model_ready:
          type: boolean
        llama_model_ready:
          type: boolean
        llama_embedding_model_ready:
          type: boolean
        errors:
          type: array
          items:
            type: string

    ModelKind:
      type: string
      enum: [whisper, llama]

    ModelPreparationStatus:
      type: string
      enum: [idle, running, completed, failed]

    ModelPreparationRecord:
      type: object
      required: [status, started_at, finished_at, heartbeat_at, last_error]
      properties:
        status:
          $ref: '#/components/schemas/ModelPreparationStatus'
        started_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        finished_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        heartbeat_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'

    ModelStatusEntryResponse:
      type: object
      required: [available, ready, error, embedding_available, embedding_ready, embedding_error, preparation]
      properties:
        available:
          type: boolean
        ready:
          type: boolean
        error:
          oneOf:
            - type: string
            - type: 'null'
        embedding_available:
          type: boolean
        embedding_ready:
          type: boolean
        embedding_error:
          oneOf:
            - type: string
            - type: 'null'
        preparation:
          $ref: '#/components/schemas/ModelPreparationRecord'

    ModelStatusResponse:
      type: object
      required: [whisper, llama]
      properties:
        whisper:
          $ref: '#/components/schemas/ModelStatusEntryResponse'
        llama:
          $ref: '#/components/schemas/ModelStatusEntryResponse'

    ModelPrepareResponse:
      type: object
      required:
        [model, status, message, ready, already_ready, deduplicated, preparation]
      properties:
        model:
          $ref: '#/components/schemas/ModelKind'
        status:
          type: string
          description: API-level status text ('ok' or 'accepted')
        message:
          type: string
        ready:
          type: boolean
        already_ready:
          type: boolean
        deduplicated:
          type: boolean
        preparation:
          $ref: '#/components/schemas/ModelPreparationRecord'

    SttTranscriptText:
      type: object
      required: [transcript_id, file_name, text]
      properties:
        transcript_id:
          type: string
        file_name:
          type: string
        text:
          type: string
          description: Markdown summary body

    SttTranscriptListResponse:
      type: object
      required: [job_id, transcripts]
      properties:
        job_id:
          type: string
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/SttTranscriptText'

    SttProgressResponse:
      type: object
      required: [job_id, task, phase, total_files, completed_files, progress_percent]
      properties:
        job_id:
          type: string
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'
        phase:
          type: string
          enum: [idle, running, completed, failed]
        total_files:
          type: integer
          minimum: 0
        completed_files:
          type: integer
          minimum: 0
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100

    SummaryTextResponse:
      type: object
      required: [job_id, file_name, text]
      properties:
        job_id:
          type: string
        file_name:
          type: string
          examples: [result.md]
        text:
          type: string
          description: Markdown summary body

    SummarySearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: Defaults to 10 and is clamped to 50.
        min_score:
          oneOf:
            - type: number
            - type: 'null'

    SummarySearchResultResponse:
      type: object
      required: [job_id, score, source_file_name, summary_file_name, summary_excerpt]
      properties:
        job_id:
          type: string
        score:
          type: number
        source_file_name:
          type: string
        summary_file_name:
          type: string
        summary_excerpt:
          type: string

    SummarySearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SummarySearchResultResponse'

    SummaryEmbeddingRecord:
      type: object
      required: [model_id, text_sha256, dimension, normalized, created_at, file_path]
      properties:
        model_id:
          type: string
        text_sha256:
          type: string
        dimension:
          type: integer
          minimum: 0
        normalized:
          type: boolean
        created_at:
          type: string
          format: date-time
        file_path:
          type: string

    SummaryEmbeddingResponse:
      type: object
      required: [job_id, status, message, reused, deduplicated, task, metadata]
      properties:
        job_id:
          type: string
        status:
          type: string
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        task:
          oneOf:
            - $ref: '#/components/schemas/TaskRecord'
            - type: 'null'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/SummaryEmbeddingRecord'
            - type: 'null'

    JobSubmissionResponse:
      type: object
      required:
        [job_id, status, message, reused, deduplicated, started_at, finished_at, source_path, source_file_name, probe, outputs, error_message]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
        reused:
          type: boolean
        deduplicated:
          type: boolean
        started_at:
          type: string
        finished_at:
          oneOf:
            - type: string
            - type: 'null'
        source_path:
          type: string
        source_file_name:
          type: string
        probe:
          $ref: '#/components/schemas/JobProbe'
        outputs:
          $ref: '#/components/schemas/JobOutputs'
        error_message:
          oneOf:
            - type: string
            - type: 'null'

    JobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobRecord'

    JobRecord:
      type: object
      required:
        [job_id, status, started_at, finished_at, source_path, source_file_name, job_dir, probe, split_strategy, outputs, error_message, summary_embedding, tasks]
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        started_at:
          type: string
        finished_at:
          oneOf:
            - type: string
            - type: 'null'
        source_path:
          type: string
        source_file_name:
          type: string
        job_dir:
          type: string
        probe:
          $ref: '#/components/schemas/JobProbe'
        split_strategy:
          $ref: '#/components/schemas/SplitStrategy'
        outputs:
          $ref: '#/components/schemas/JobOutputs'
        error_message:
          oneOf:
            - type: string
            - type: 'null'
        summary_embedding:
          oneOf:
            - $ref: '#/components/schemas/SummaryEmbeddingRecord'
            - type: 'null'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskRecord'

    TaskRecord:
      type: object
      required: [task_id, task_type, status, started_at, finished_at, last_error, retry_count]
      properties:
        task_id:
          type: string
        task_type:
          $ref: '#/components/schemas/TaskType'
        status:
          $ref: '#/components/schemas/TaskStatus'
        started_at:
          type: string
        finished_at:
          oneOf:
            - type: string
            - type: 'null'
        last_error:
          oneOf:
            - type: string
            - type: 'null'
        retry_count:
          type: integer
          minimum: 0

    JobProbe:
      type: object
      required: [channels, channel_layout]
      properties:
        channels:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        channel_layout:
          oneOf:
            - type: string
            - type: 'null'

    JobOutputs:
      type: object
      required: [merged_mono_wav, split_mono_wavs]
      properties:
        merged_mono_wav:
          oneOf:
            - type: string
            - type: 'null'
        split_mono_wavs:
          type: array
          items:
            $ref: '#/components/schemas/JobSplitOutput'

    JobSplitOutput:
      type: object
      required: [channel_index, path]
      properties:
        channel_index:
          type: integer
          minimum: 0
        path:
          type: string

    JobStatus:
      type: string
      enum: [running, completed, failed]

    TaskStatus:
      type: string
      enum: [running, completed, failed]

    TaskType:
      type: string
      enum: [ffmpeg, stt, summary, embedding]

    SplitStrategy:
      type: string
      enum: [per_channel_plus_merged_mono]
