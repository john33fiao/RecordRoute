name: tauri-lifecycle-poc

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run OpenAPI contract drift check
        run: |
          python scripts/check_contract_drift.py \
            --spec docs/openapi.yaml \
            --spec docs/swagger/openapi.yaml \
            --report artifacts/contracts/${{ github.run_id }}/contract-drift-report.json

      - name: Upload contract drift artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-drift-report
          path: artifacts/contracts/${{ github.run_id }}/contract-drift-report.json
          if-no-files-found: error

  tauri-lifecycle-probe:
    needs: contract-drift
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build required binaries
        run: cargo build --bins

      - name: Build Tauri app (Smoke Test)
        run: cd src-tauri && cargo build
        
      - name: Run lifecycle probe (orchestrator + swagger)
        run: cargo run --quiet --bin tauri_lifecycle_probe

      - name: Upload lifecycle probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-lifecycle-${{ matrix.os }}
          path: artifacts/tauri-lifecycle/**
          if-no-files-found: error
