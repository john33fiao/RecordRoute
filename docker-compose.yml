services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: recordroute-backend:latest
    container_name: recordroute-backend
    ports:
      - "8080:8080"
      - "8765:8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      WORKFLOW_DEVICE: auto
      DB_FOLDER_PATH: /data/DB
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llamacpp:8081}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://llamacpp:8081}
      LLAMA_CPP_MODEL_CACHE_DIR: ${LLAMA_CPP_MODEL_CACHE_DIR:-./models}
      HF_MODEL_REPO_ID: ${HF_MODEL_REPO_ID:-}
      HF_MODEL_FILENAME: ${HF_MODEL_FILENAME:-}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./DB:/data/DB
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
    image: recordroute-frontend:latest
    container_name: recordroute-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: recordroute-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: recordroute-llamacpp
    profiles: ["llamacpp"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --model
      - /models/model.gguf
      - --embeddings
    ports:
      - "8081:8081"
    volumes:
      - ./models:/models

volumes:
  ollama_data:
